name: Deck on GitHub Pages
on:
  push:
    branches: [main]
    paths: ['slides/**', 'docs/defence/**', 'eval/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: slides
      - run: npm run build:public
        working-directory: slides
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist-public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
