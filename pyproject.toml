[project]
name = "stayline"
version = "0.1.0"
description = "An AI agent that applies a court-ordered freeze to the right life-insurance contract, and nothing more."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "mcp[cli]==2.3.0",
    "openai==3.31.0",
    "openai-agents==0.24.0",
    "pydantic==2.14.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]
demo = ["arize-phoenix"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stayline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
